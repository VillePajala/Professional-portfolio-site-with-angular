<!-- Single Page Content -->
<div class="single-page-container">
  <router-outlet></router-outlet>
</div>

<!-- Ink cursor trail + click ripples (desktop, motion-safe only) -->
<canvas #inkCanvas class="ink-canvas" aria-hidden="true"></canvas>

<!-- Ink-bleed page transition -->
<div class="ink-wipe" [class.active]="inkWipe" aria-hidden="true"></div>

<!-- Easter egg: triple-click the name → two decades of ink flood the page -->
<div class="art-flood" *ngIf="floodActive" aria-hidden="true">
  <img *ngFor="let a of floodArt" [src]="a.src" [ngStyle]="a.style" alt="" loading="eager">
</div>
