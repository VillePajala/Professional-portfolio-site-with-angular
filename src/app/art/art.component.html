<div class="art-page">
  <div class="container" id="pageHeader">
    <h2>ART</h2>
  </div>

  <p class="art-intro">
    Black-and-white ink work made as <em>Johannes Kamikaze</em> (~2000–2015) —
    eyes, sacred geometry, cellular networks, and horror vacui. Click any piece to view it large.
  </p>

  <div class="art-gallery">
    <figure class="art-tile" *ngFor="let art of artworks; let i = index" (click)="open(i)">
      <img [src]="art.src" [alt]="art.title" loading="lazy" class="img-fluid">
      <figcaption>
        <span class="art-title">{{ art.title }}</span>
        <span class="art-meta">{{ art.meta }}</span>
      </figcaption>
    </figure>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" *ngIf="lightboxOpen" (click)="close()">
  <button class="lightbox-close" (click)="close()" aria-label="Close">&times;</button>
  <button class="lightbox-nav lightbox-prev" (click)="prev($event)" aria-label="Previous">&#8249;</button>

  <figure class="lightbox-content" (click)="$event.stopPropagation()">
    <img [src]="artworks[currentIndex].src" [alt]="artworks[currentIndex].title">
    <figcaption>
      <span class="art-title">{{ artworks[currentIndex].title }}</span>
      <span class="art-meta">{{ artworks[currentIndex].meta }}</span>
    </figcaption>
  </figure>

  <button class="lightbox-nav lightbox-next" (click)="next($event)" aria-label="Next">&#8250;</button>
</div>
